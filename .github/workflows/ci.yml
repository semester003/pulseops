name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pulseops:pulseops@localhost:5432/pulseops?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      JWT_EXPIRES_IN: 8h
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
